# Sao lưu DB Neon mỗi đêm (02:00 giờ Việt Nam) — gói Free của Neon chỉ giữ lịch sử ~1 ngày.
# Chỉ lấy schema public (dữ liệu thật), nén dạng pg_dump custom, MÃ HÓA bằng BACKUP_PASSPHRASE rồi lưu thành artifact 30 ngày.
# Cần secret DATABASE_URL và BACKUP_PASSPHRASE. Khôi phục: docs/backend.md#sao-lưu-db-tự-động
name: Sao lưu DB

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Secret thô; bước "Chuẩn hóa DATABASE_URL" bỏ dấu nháy rồi đặt DATABASE_URL cho các bước sau
      RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Kiểm tra secrets
        run: |
          if [ -z "$RAW_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Thiếu secret DATABASE_URL hoặc BACKUP_PASSPHRASE (GitHub › Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - name: Chuẩn hóa DATABASE_URL
        run: |
          # Chấp nhận secret dán kèm dấu nháy hoặc cả dòng "DATABASE_URL=..." (chép từ be/.env)
          URL=$(printf '%s' "$RAW_DATABASE_URL" | tr -d '\r\n')
          URL="${URL#DATABASE_URL=}"
          URL="${URL#\"}"; URL="${URL%\"}"; URL="${URL#\'}"; URL="${URL%\'}"
          echo "::add-mask::$URL"
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::Secret DATABASE_URL phải bắt đầu bằng postgresql:// (dán đúng connection string Neon)."; exit 1 ;;
          esac
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: pg_dump (Postgres 18, cùng bản với Neon) và mã hóa
        run: |
          # pg_dump cần kết nối trực tiếp, không qua pooler
          export PGURL="${DATABASE_URL/-pooler./.}"
          STAMP=$(date -u -d '+7 hours' +%Y%m%d-%H%M)
          FILE="candle2510-$STAMP.dump"
          docker run --rm -e PGURL -v "$PWD:/out" postgres:18 \
            sh -c 'pg_dump "$PGURL" --format=custom --no-owner --no-privileges --schema=public --file=/out/'"$FILE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"
          ls -la "$FILE.gpg"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=db-$STAMP" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
