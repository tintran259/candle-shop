# Kiểm tra tự động mỗi lần push / mở PR (docs/testing.md#kiểm-tra-tự-động-ci).
# Render chỉ deploy khi các kiểm tra này qua (render.yaml: autoDeployTrigger: checksPass).
# Test cần DB chạy trên Postgres 18 dựng ngay trong máy CI (cùng bản với Neon) — không gọi Neon ở Singapore (chậm ~200 ms mỗi truy vấn,
# tốn giờ chạy DB gói free), không cần secret. Ba job chạy song song.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: "24"
  # Postgres trong máy CI (service postgres bên dưới). Test dùng schema riêng (bo_test, bo_e2e)
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/candle

jobs:
  be:
    name: BE — typecheck, lint, unit, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candle
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: be/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: E2E trên DB (schema bo_test)
        run: pnpm test:e2e

  bo:
    name: BO — typecheck, lint, build, quy tắc nghiệp vụ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bo
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: bo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint src e2e-be playwright.be.config.ts
      - run: pnpm build
      # Quy tắc tính tiền, trạng thái… (không mở trình duyệt). Bộ kịch bản đầy đủ (~30 phút) vẫn chạy trên máy
      - name: Quy tắc nghiệp vụ (e2e/logic)
        run: npx playwright test e2e/logic

  e2e-be:
    name: BO + BE thật (e2e-be)
    runs-on: ubuntu-latest
    env:
      PW_CHANNEL: chromium
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candle
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            be/pnpm-lock.yaml
            bo/pnpm-lock.yaml
      - name: Cài thư viện BE, BO và Chromium
        run: |
          (cd be && pnpm install --frozen-lockfile)
          (cd bo && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium)
      - name: Chạy e2e-be
        working-directory: bo
        run: pnpm test:e2e:be
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-be
          path: bo/playwright-report-be
          retention-days: 7
