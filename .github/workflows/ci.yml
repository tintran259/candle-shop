# Kiểm tra tự động mỗi lần push / mở PR (docs/testing.md#kiểm-tra-tự-động-ci).
# Render chỉ deploy khi các kiểm tra này qua (render.yaml: autoDeployTrigger: checksPass).
# Test cần DB (BE e2e trên schema bo_test, BO + BE thật trên schema bo_e2e) chỉ chạy khi repo có secret DATABASE_URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: "24"
  # Máy CI của GitHub ở Mỹ, DB Neon ở Singapore: mỗi truy vấn ~200 ms — nới giới hạn giao dịch và thời gian mỗi test
  DB_TX_TIMEOUT_MS: "60000"
  E2E_TEST_TIMEOUT_MS: "180000"

jobs:
  be:
    name: BE — typecheck, lint, unit, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    env:
      # Secret thô; bước "Chuẩn hóa DATABASE_URL" bỏ dấu nháy rồi đặt DATABASE_URL cho các bước sau
      RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: be/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Chuẩn hóa DATABASE_URL
        if: env.RAW_DATABASE_URL != ''
        run: |
          # Chấp nhận secret dán kèm dấu nháy hoặc cả dòng "DATABASE_URL=..." (chép từ be/.env)
          URL=$(printf '%s' "$RAW_DATABASE_URL" | tr -d '\r\n')
          URL="${URL#DATABASE_URL=}"
          URL="${URL#\"}"; URL="${URL%\"}"; URL="${URL#\'}"; URL="${URL%\'}"
          echo "::add-mask::$URL"
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::Secret DATABASE_URL phải bắt đầu bằng postgresql:// (dán đúng connection string Neon)."; exit 1 ;;
          esac
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: E2E trên DB (schema bo_test)
        if: env.RAW_DATABASE_URL != ''
        run: pnpm test:e2e

  bo:
    name: BO — typecheck, lint, build, quy tắc nghiệp vụ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bo
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: bo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint src e2e-be playwright.be.config.ts
      - run: pnpm build
      # Quy tắc tính tiền, trạng thái… (không mở trình duyệt). Bộ kịch bản đầy đủ (~30 phút) vẫn chạy trên máy
      - name: Quy tắc nghiệp vụ (e2e/logic)
        run: npx playwright test e2e/logic

  e2e-be:
    name: BO + BE thật (e2e-be)
    needs: [be, bo]
    runs-on: ubuntu-latest
    env:
      # Secret thô; bước "Chuẩn hóa DATABASE_URL" bỏ dấu nháy rồi đặt DATABASE_URL cho các bước sau
      RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PW_CHANNEL: chromium
    steps:
      - name: Bỏ qua khi chưa có secret DATABASE_URL
        if: env.RAW_DATABASE_URL == ''
        run: echo "::notice::Chưa có secret DATABASE_URL — bỏ qua e2e BO + BE thật."
      - uses: actions/checkout@v5
        if: env.RAW_DATABASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: env.RAW_DATABASE_URL != ''
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        if: env.RAW_DATABASE_URL != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            be/pnpm-lock.yaml
            bo/pnpm-lock.yaml
      - name: Chuẩn hóa DATABASE_URL
        if: env.RAW_DATABASE_URL != ''
        run: |
          # Chấp nhận secret dán kèm dấu nháy hoặc cả dòng "DATABASE_URL=..." (chép từ be/.env)
          URL=$(printf '%s' "$RAW_DATABASE_URL" | tr -d '\r\n')
          URL="${URL#DATABASE_URL=}"
          URL="${URL#\"}"; URL="${URL%\"}"; URL="${URL#\'}"; URL="${URL%\'}"
          echo "::add-mask::$URL"
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::Secret DATABASE_URL phải bắt đầu bằng postgresql:// (dán đúng connection string Neon)."; exit 1 ;;
          esac
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Cài thư viện BE, BO và Chromium
        if: env.RAW_DATABASE_URL != ''
        run: |
          (cd be && pnpm install --frozen-lockfile)
          (cd bo && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium)
      - name: Chạy e2e-be
        if: env.RAW_DATABASE_URL != ''
        working-directory: bo
        run: pnpm test:e2e:be
      - uses: actions/upload-artifact@v4
        if: failure() && env.RAW_DATABASE_URL != ''
        with:
          name: playwright-report-be
          path: bo/playwright-report-be
          retention-days: 7
