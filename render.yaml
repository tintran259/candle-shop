# Render Blueprint — BE (NestJS + Prisma, DB Postgres ở Neon) và BO (trang tĩnh Vite) chạy trên Render (docs/backend.md#đưa-lên-render).
# Tạo: Render › New › Blueprint › chọn repo này. Bí mật (sync: false) nhập trên Render, không ghi vào đây.
services:
  - type: web
    name: candle2510-be
    runtime: node
    # Cùng vùng với Neon (Singapore) để truy vấn nhanh
    region: singapore
    plan: free
    rootDir: be
    # Gói Free không có pre-deploy command: chạy migrate ngay trong bước build (chỉ áp migration mới, không xóa dữ liệu)
    buildCommand: npx -y pnpm@10.33.4 install --frozen-lockfile && npx -y pnpm@10.33.4 run build && npx -y pnpm@10.33.4 run db:deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    # Chỉ deploy khi CI trên GitHub qua (.github/workflows/ci.yml)
    autoDeployTrigger: checksPass
    # Chỉ build lại khi BE đổi (sửa bo/, docs/… không làm BE khởi động lại)
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Connection string Neon (bản -pooler). Migrate tự bỏ "-pooler" để kết nối trực tiếp
      - key: DATABASE_URL
        sync: false
      # Render tự sinh chuỗi ngẫu nhiên để ký token đăng nhập
      - key: JWT_SECRET
        generateValue: true
      # Mã băm PIN: chạy `pnpm auth:pin <6 số>` trên máy, dán phần sau dấu =
      - key: ADMIN_PIN_HASH
        sync: false
      # Địa chỉ BO được gọi API (CORS), nhiều địa chỉ cách nhau dấu phẩy, vd https://candle2510-bo.onrender.com,http://localhost:3001
      - key: BO_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Kho ảnh Cloudinary (cloudinary.com › Settings › API Keys). Để trống thì BO lưu ảnh tạm trong DB
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Theo dõi lỗi Sentry (project Node). Để trống thì không gửi gì (docs/backend.md#theo-dõi-lỗi-sentry)
      - key: SENTRY_DSN
        sync: false

  # BO: trang tĩnh (Vite build), gọi BE qua VITE_API_URL — gán lúc build nên đổi địa chỉ BE thì phải build lại
  - type: web
    name: candle2510-bo
    runtime: static
    rootDir: bo
    buildCommand: npx -y pnpm@10.33.4 install --frozen-lockfile && npx -y pnpm@10.33.4 run build
    staticPublishPath: dist
    # Chỉ deploy khi CI trên GitHub qua (.github/workflows/ci.yml)
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - bo/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://candle2510-be.onrender.com/api
      # Theo dõi lỗi Sentry (project React). Gắn lúc build — đổi thì build lại BO. Để trống thì không gửi gì
      - key: VITE_SENTRY_DSN
        sync: false
      # Không tải trình duyệt của Playwright khi cài thư viện (chỉ dùng cho test)
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
    # Trang một trang (React Router): mọi đường dẫn trả index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File build có mã băm trong tên — giữ cache lâu
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
